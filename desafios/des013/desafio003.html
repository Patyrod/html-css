<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
        }

        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        thead, tfoot {
            background-color: #383838;
            color: white;
        }
        thead > tr > th {
            position: sticky;
            top: -1px;
            background-color: #383838;
        }

        th.media {
            text-align: left;
        }

        
    </style>
</head>
<body>
    <h1>Desafio de Tabelas</h1>

    <table>
        <caption>
            Disciplinas
        </caption>
        <thead>
            <tr>
                <th scope="col">Area</th>
                <th scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas<br>Notas 1 notas 2</th>
                <th scope="col">Média</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>

            <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <thead>
            <tr>
                    <th class="media" colspan="4" scope="colgroup"> Media de Exatas</th>
                    <td>0.0</td>
                </tr>
        </thead>

        <tr>
            <th rowspan="2" scope="rowgroup">Humanas</th>
            <td>história</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>


        </tbody>
        
        <tfoot>
            <tr>
                <th class="media" colspan="4" scope="colgroup">Média de humanas</th>
                <td>0.0</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
